version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ConnectionStrings__DefaultConnection=Server=db;Database=eventos_db;User=root;Password=root;
    depends_on:
      - db
    networks:
      - eventos_network

  db:
    image: mysql:8.0
    container_name: eventos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventos_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eventos_network

  adminer:
    image: adminer
    container_name: eventos_adminer
    ports:
      - "8080:8080"
    networks:
      - eventos_network
    depends_on:
      - db

volumes:
  mysql_data:

networks:
  eventos_network:
    name: eventos_network
    driver: bridge
